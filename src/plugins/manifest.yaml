# Runtime assembly manifest (versioned in-repo). Rows are cordis loader entry
# options; `name` resolves through the static module map
# (src/plugins/server/modules.ts or src/plugins/client/modules.ts).
# Configs are plain YAML data — `!js` expressions
# are unsupported on workerd (see docs/PLUGINS.md).
server:
  - id: keywords
    name: keywords
  - id: sam
    name: sam
  - id: google-oauth
    name: google-oauth
  - id: google-ads
    name: google-ads
  - id: ai
    name: ai
    config:
      textProvider: vercel_gateway
  - id: vercel-gateway
    name: vercel-gateway
  - id: systemone
    name: systemone
  - id: seo-data
    name: seo-data
    config:
      keywordMetrics: dataforseo
      serpLive: dataforseo
  - id: dataforseo
    name: dataforseo
client:
  - id: keywords
    name: keywords
  - id: sam
    name: sam
  - id: locale
    name: locale
  - id: google-oauth
    name: google-oauth
  - id: ai
    name: ai
