# Runtime assembly manifest (versioned in-repo). Rows are cordis loader entry
# options; `name` resolves through the static module map
# (src/plugins/server/modules.ts or src/plugins/client/modules.ts).
# Configs are plain YAML data — `!js` expressions
# are unsupported on workerd (see docs/PLUGINS.md).
server:
  - id: google-oauth
    name: google-oauth
  - id: google-ads
    name: google-ads
  - id: ai-models
    name: ai-models
    config:
      textProvider: vercel_gateway
  - id: vercel-gateway
    name: vercel-gateway
  - id: systemone
    name: systemone
  - id: ai-agents
    name: ai-agents
    config:
      keywordDimensions: ai-sdk
  - id: keyword-dimension-agent
    name: keyword-dimension-agent
  - id: seo-data
    name: seo-data
    config:
      keywordMetrics: dataforseo
      serpLive: dataforseo
  - id: dataforseo
    name: dataforseo
client:
  - id: locale
    name: locale
  - id: google-oauth
    name: google-oauth
