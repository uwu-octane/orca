name: orca
services:
  orca:
    image: ${ORCA_IMAGE:?ORCA_IMAGE is required}
    container_name: orca
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ./data/state:/app/.wrangler/state
    networks:
      - shared-data
    logging:
      driver: journald
      options:
        tag: orca
  tunnel:
    image: cloudflare/cloudflared@sha256:004d843fa5fdc3103983fd580ee19fab4a8fa98add31f87249c1659e848c98e0
    container_name: orca-tunnel
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    command:
      [
        "tunnel",
        "--config",
        "/etc/cloudflared/config.yml",
        "--no-autoupdate",
        "run",
      ]
    volumes:
      - ./tunnel:/etc/cloudflared:ro
    logging:
      driver: journald
      options:
        tag: orca-tunnel
networks:
  shared-data:
    external: true
