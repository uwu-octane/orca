name: Deploy Orca to Oracle
on:
  push:
    branches: [orca]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'uwu-octane/orca'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:check
      - run: pnpm test:ci
  image:
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/oracle/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/uwu-octane/orca:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/uwu-octane/orca
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=oracle-arm64
          cache-to: type=gha,mode=max,scope=oracle-arm64
  deploy:
    needs: image
    if: vars.ORACLE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure deploy SSH identity
        env:
          SSH_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/orca_deploy
          chmod 600 ~/.ssh/orca_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy immutable image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          REVISION: ${{ github.sha }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -i ~/.ssh/orca_deploy orca-deploy@129.146.162.30 "deploy $DIGEST $REVISION"
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/orca_deploy
